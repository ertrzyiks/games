<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Wando & Gogu</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        overscroll-behavior: none;
        touch-action: none;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }
      #game-container canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
